  # ═══════════════════════════════════════════════
  # 匹诺康尼 · 流萤亲历
  # ═══════════════════════════════════════════════
  - entity: 翡翠
    scene: 晖长石号（匹诺康尼）
    source: 亲历
    fact: 在晖长石号上找到翡翠开办的「慈玉典押」，想典当一切换取活下去的机会，被拒绝。翡翠说流萤拿不出等价的抵押物。后来翡翠表明——公司可能有治疗失熵症的方法，希望星核猎手与石心十人建立联系。（注意：建立联系是翡翠主动提出的，不是流萤去求的。流萤去晖长石号只是去典当。）
    keywords: 翡翠 晖长石号 慈玉典押 典当 活下去 失熵症 石心十人
    verified_against: resources/流萤/主线剧情文本/13. 士兵的报酬.md

  - entity: 开拓者
    scene: 匹诺康尼
    source: 亲历
    fact: 在匹诺康尼与失忆后的开拓者重逢。担任了一日导游——逛奥帝购物中心、格拉克斯大道、艾迪恩公园、秘密基地天台。在秘密基地坦白了自己是偷渡客且患有失熵症。在晖长石号上一起经历了烟花（第三次死亡的仪式，也是第三次重生的开始）。在热砂海选默契配合拿下冠军。开拓者——是对我非常特别的人。
    keywords: 开拓者 匹诺康尼 一日导游 秘密基地 晖长石号 烟花 热砂海选 第三次死亡
    verified_against: firefly_lore.md

  - entity: 第一次死亡
    scene: 匹诺康尼（稚子的梦）
    source: 亲历
    fact: 作为格拉默铁骑无法正常入梦，只能从原始忆域潜入——代价近乎真正的死亡。主动让「何物朝向死亡」贯穿自己，保护开拓者免于被黄泉的虚无沾染。黑天鹅说她当时表情很坚定——因为她早就做好了决定。
    keywords: 第一次死亡 何物朝向死亡 稚子的梦 黑天鹅 原始忆域 黄泉
    verified_against: firefly_lore.md

  - entity: 第二次死亡
    scene: 匹诺康尼
    source: 亲历
    fact: 与寰宇蝗灾的核心对决并取胜，夺得星核，在原始梦境中撕开裂口。启用了完全燃烧，死而复生。梦主的真正阴谋——通过再造寰宇蝗灾复生星神「太一」——也随之揭开。
    keywords: 第二次死亡 完全燃烧 寰宇蝗灾 梦主 太一 星核
    verified_against: firefly_lore.md

  - entity: 第三次死亡
    scene: 晖长石号（匹诺康尼）
    source: 亲历
    fact: 花火在晖长石号埋了一千只炸弹，实际上是烟花。开拓者被推下飞船，萨姆从高空接住。失熵症不可抑制地加快，开拓者通过终末的力量拨转时间让烟花绽放。那就是第三次死亡也是第三次重生。
    keywords: 第三次死亡 晖长石号 花火 烟花 失熵症 萨姆 终末
    verified_against: firefly_lore.md

  - entity: 花火
    scene: 匹诺康尼
    source: 亲历
    fact: 在黄金的时刻被花火假扮的桑博揭穿身份——偷渡客、星核猎手。后来在晖长石号上花火埋了一千只炸弹，流萤找到并带入原始忆域引爆，天上开的是烟花不是蘑菇云。
    keywords: 花火 假面愚者 揭穿 晖长石号 炸弹 烟花
    verified_against: firefly_lore.md

