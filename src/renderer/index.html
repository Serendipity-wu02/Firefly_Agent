<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:* assets:; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: assets: http://localhost:*; connect-src 'self' http://localhost:* ws://localhost:* assets:; media-src 'self' blob: data: http://localhost:*; font-src 'self' data:;" />
  <title>Firefly Agent - Desktop Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #live2d-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #proactive-line-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 210px;
      max-width: 210px;
      max-height: 68px;
      padding: 8px 10px;
      overflow: hidden;
      border: 1px solid rgba(45, 122, 95, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      color: #234f3b;
      font: 11px/1.45 "Microsoft YaHei", "Segoe UI", sans-serif;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      pointer-events: none;
      z-index: 2;
    }
    #proactive-line-overlay[hidden] {
      display: none;
    }
  </style>
  <script src="./live2d/live2dcubismcore.min.js"></script>
</head>
<body>
  <div id="app-container">
    <canvas id="live2d-canvas"></canvas>
    <div id="proactive-line-overlay" hidden aria-live="polite"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
